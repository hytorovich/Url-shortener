# Срок жизни ссылки в минутах (задаёт система, а не пользователь). 1440 = сутки.
link.ttl-minutes=1440

# Лимит переходов, если пользователь не указал свой.
link.default-limit=10

# Максимальный лимит, который можно задать.
link.max-limit=1000

# Длина короткого кода.
link.code-length=6

# Домен коротких ссылок: sh.rt/aB3x9Q
link.domain=sh.rt

# Как часто фоновый поток удаляет истёкшие ссылки, в секундах.
cleanup.interval-seconds=60
